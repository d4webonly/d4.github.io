<!doctype html>
<html lang="ja">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T7475ZWKZY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-T7475ZWKZY');
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>幽廻印刷所</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.ico" />
  </head>
  <body>
    <div id="bootEffect" class="boot-effect" aria-hidden="true">
      <div class="boot-effect__noise"></div>
      <div class="boot-effect__scanline"></div>
      <div class="boot-effect__flash"></div>
    </div>

    <div class="app-shell">
      <header class="chat-header">
        <img
          class="avatar"
          src="assets/alice_icon.jpg"
          alt="icon"
          >
        <div class="profile">
          <div class="profile-name">繧｢繝ｪ繧ｹ</div>
          <div id="statusText" class="profile-status online">オンライン</div>
        </div>
        <button
          class="privacy-cookie-button"
          type="button"
          aria-label="プライバシーポリシーを表示"
          title="プライバシーポリシー"
        >
          <span class="material-symbols-outlined" aria-hidden="true">cookie</span>
        </button>
      </header>

      <main id="chatLog" class="chat-log" aria-live="polite">
        <div id="messageList" class="message-list"></div>
        <div id="typingIndicator" class="typing-indicator" hidden>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <button id="newMessageButton" class="new-message-button" type="button" hidden>
          新規メッセージがあります
        </button>
      </main>

      <form id="messageForm" class="message-form" autocomplete="off">
        <input
          id="messageInput"
          class="message-input"
          type="text"
          name="message"
          placeholder="メッセージを入力"
          aria-label="メッセージ"
        >
        <div id="stampPicker" class="stamp-picker" hidden></div>
        <button
          id="stampButton"
          class="stamp-button"
          type="button"
          aria-label="スタンプを選択"
          title="スタンプ"
        >
          <span class="material-symbols-outlined" aria-hidden="true">mood</span>
        </button>
        <button id="sendButton" class="send-button" type="submit">送信</button>
      </form>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
